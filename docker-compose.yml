services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: event-management-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password123!
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P Password123! -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-management-api
    ports:
      - "5026:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=db;Database=EventDB;User Id=sa;Password=Password123!;TrustServerCertificate=True;
      - Serilog__WriteTo__1__Args__ConnectionString=Server=db;Database=EventDB;User Id=sa;Password=Password123!;TrustServerCertificate=True;
      - Serilog__WriteTo__1__Args__AutoCreateSqlDatabase=true
    depends_on:
      db:
        condition: service_healthy

# Removed custom networks to use default bridge for easier resolution
